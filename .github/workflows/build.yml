name: build

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
        shell: bash
      - run: npm run dist
        env:
          # No Apple signing identity in CI: produce unsigned dmgs.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      # Lite installers (#28): the same build output without resources/pet; only the packaging runs again.
      - run: npx electron-builder --config electron-builder.lite.yml --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: qqpet-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm run typecheck && npm run build:android-web
      - run: |
          : "${KEYSTORE_BASE64:?set the ANDROID_KEYSTORE_BASE64 secret}"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - run: ./gradlew assembleRelease
        working-directory: android
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: mkdir dist && mv android/app/build/outputs/apk/release/app-release.apk "dist/QQPet-${GITHUB_REF_NAME#v}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: qqpet-android
          path: dist/*.apk
          if-no-files-found: error

  harmony:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm run typecheck && npm run build:harmony-web && node scripts/pack-harmony.mjs
      - name: Stamp Harmony version
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from 'node:fs'
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version
          const code = version.split('-')[0].split('.').reduce((c, p) => c * 100 + Number(p), 0)
          const p = 'harmony/AppScope/app.json5'
          writeFileSync(p, readFileSync(p, 'utf8')
            .replace(/"versionCode":\s*\d+/, `"versionCode": ${code}`)
            .replace(/"versionName":\s*"[^"]+"/, `"versionName": "${version}"`)
            .replace(/"debug":\s*true/, '"debug": false'))
          EOF
      - uses: isaced/setup-ohos@v1
        with:
          hvigor: true
      - name: Assemble HAP
        working-directory: harmony
        run: |
          : "${DEVECO_SDK_HOME:?setup-ohos did not set DEVECO_SDK_HOME}"
          printf 'hwsdk.dir=%s\nsdk.dir=%s\n' "$DEVECO_SDK_HOME" "$DEVECO_SDK_HOME" > local.properties
          hvigorw assembleHap --mode module -p product=default -p buildMode=release --no-daemon
      - name: Name HAP
        run: |
          hap=$(ls harmony/entry/build/default/outputs/default/entry-default-*.hap)
          test -f "$hap"
          mkdir dist
          mv "$hap" "dist/QQPet-${GITHUB_REF_NAME#v}.hap"
      - uses: actions/upload-artifact@v4
        with:
          name: qqpet-harmony
          path: dist/*.hap
          if-no-files-found: error

  ios:
    uses: ./.github/workflows/ios-build.yml
    with:
      version: ${{ github.ref_name }}

  release:
    needs: [build, android, harmony, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history and tags, to find the previous release.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      # Content packs (#28): the full core pack and the resources/pet changes since the previous tag, plus packs.json.
      # The full installers above carry the content too; lite installers download this pack on first run.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Content packs
        run: |
          git lfs install --local
          git lfs pull --include "resources/pet/**"
          # A stable tag compares against the previous stable one: its own betas would equal it.
          case "$GITHUB_REF_NAME" in *-*) skip="" ;; *) skip="--exclude=*-*" ;; esac
          prev=$(git describe --tags --abbrev=0 $skip "$GITHUB_REF_NAME^" 2>/dev/null || true)
          node --experimental-strip-types scripts/pack-content.mjs --version "${GITHUB_REF_NAME#v}" --full ${prev:+--base "$prev"} \
            --out artifacts --url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/"
      # Commit subjects since the previous tag, grouped by gitmoji; docs, CI and refactors are left out.
      - name: Release notes
        run: |
          # A stable tag compares against the previous stable one: its own betas would equal it.
          case "$GITHUB_REF_NAME" in *-*) skip="" ;; *) skip="--exclude=*-*" ;; esac
          prev=$(git describe --tags --abbrev=0 $skip "$GITHUB_REF_NAME^" 2>/dev/null || true)
          range=${prev:+$prev..}$GITHUB_REF_NAME
          section() {
            local lines
            lines=$(git log --no-merges --format=%s "$range" | grep -E "^($2) " | sed -E 's/^:[a-z_]+: //; s/^\(([^)]+)\): /**\1**：/; s/^/- /' || true)
            if [ -n "$lines" ]; then printf '## %s\n\n%s\n\n' "$1" "$lines"; fi
          }
          {
            # Which installer to take: full ones carry the pet content, lite ones fetch it on first run (#28).
            printf '%s\n\n' \
              '## 下载哪个' \
              '- **完整版**（约 450–520 MB，自带宠物内容，装好即用）：Windows `QQPet.Setup.*.exe`，macOS `QQPet-*-arm64.dmg`（Apple 芯片）/ `QQPet-*.dmg`（Intel），Linux `QQPet-*.AppImage` / `qqpet_*_amd64.deb`（ARM64 为 `QQPet-*-arm64.AppImage` / `qqpet_*_arm64.deb`）' \
              '- **精简版**（约 120–160 MB，不带宠物内容）：文件名带 `Lite`。首次启动时在窗口里下载内容包（可填加速镜像），或导入已下载的 `QQPet-content-*.qqpetpack`' \
              '- **内容包** `QQPet-content-*.qqpetpack`：给精简版首次使用，或在「设置 → 内容包」里导入；已经装了完整版不需要下载'
            section 新功能 ':sparkles:'
            section 修复 ':bug:|:ambulance:'
            section 优化 ':zap:|:lipstick:'
          } > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: artifacts/*
          # Tags with a hyphen (v0.7.0-beta.1) are pre-releases and never become "latest", so Lite first-run downloads skip them.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
